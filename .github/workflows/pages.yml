name: Deploy WebAssembly demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant the token the permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the WebAssembly binary and assemble the site
        run: |
          mkdir -p dist
          # Compile the game to wasm (assets are embedded, so nothing else to copy).
          GOOS=js GOARCH=wasm go build -o dist/kinetix.wasm .
          # Use the JS shim that matches the compiler we just built with.
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/
          cp index.html dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
